services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: squire-db
    environment:
      POSTGRES_USER: squire
      POSTGRES_PASSWORD: squire_dev
      POSTGRES_DB: squire
    ports:
      - "5435:5432"
    volumes:
      - squire_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squire -d squire"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local MinIO for media-feature development. Throwaway credentials, single
  # bucket. Production runs separately on the VPS with proper secrets +
  # least-privilege user — do NOT use this compose's creds anywhere real.
  # Bootstrap the bucket once: scripts/bootstrap-local-minio.sh
  minio:
    image: minio/minio:latest
    container_name: squire-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_dev
      MINIO_ROOT_PASSWORD: minio_dev_password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - squire_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  squire_data:
  squire_minio_data:
